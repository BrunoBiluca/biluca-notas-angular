<div class="modal-overlay" (click)="closeModal()">
  <div
    class="modal-content"
    (click)="$event.stopPropagation()"
    [adaptCustomColor]="color()"
  >
    <button matIconButton class="close-button" (click)="closeModal()">
      <mat-icon>close</mat-icon>
    </button>

    @if(note() !== null) { @if(images().length > 0) {
    <div class="note-images">
      @for (image of images(); track $index) {
      <img src="{{ image }}" title="{{ image }}" />
      }
    </div>
    }
    <div class="note-details">
      <input
        name="title"
        class="input-text title"
        type="text"
        [(ngModel)]="title"
        (ngModelChange)="save()"
      />
      <input
        name="content"
        class="input-text content"
        type="text"
        [(ngModel)]="content"
        (ngModelChange)="save()"
      />
      <div class="note-meta">
        <span>Criada em: {{ note()?.created_at | date }}</span>
        <span>Atualizada em: {{ note()?.updated_at | date }}</span>
      </div>
    </div>
    <div class="controls">
      <note-color-input
        [color]="color()"
        (onColorChange)="updateColor($event)"
      ></note-color-input>
    </div>
    }
  </div>
</div>
