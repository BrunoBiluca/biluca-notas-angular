<div class="color-picker-container">
  <input
    #colorInput
    type="color"
    name="color"
    [(ngModel)]="color"
    (ngModelChange)="update()"
  />
  <button
    type="button"
    matIconButton
    matTooltip="Escolher cor"
    (click)="colorInput.click()"
  >
    <mat-icon>color_lens</mat-icon>
  </button>
</div>
