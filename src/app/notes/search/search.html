<div class="search-area">
  <button matIconButton>
    <mat-icon>search</mat-icon>
  </button>
  <input
    id="search"
    type="text"
    placeholder="Pesquisar..."
    [(ngModel)]="searchTerm"
    (ngModelChange)="onChangeSearchTerm()"
  />
  <button matIconButton>
    <mat-icon>cancel</mat-icon>
  </button>
</div>
