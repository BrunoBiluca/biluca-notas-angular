<div class="search-area">
  <button matIconButton>
    <mat-icon>search</mat-icon>
  </button>
  <input
    id="search"
    type="text"
    placeholder="Pesquisar..."
    [(ngModel)]="searchTerm"
    (ngModelChange)="updateGlobally()"
  />
  @if(searchTerm().length > 0) {
  <button matIconButton (click)="clear()">
    <mat-icon>cancel</mat-icon>
  </button>
  }
</div>
